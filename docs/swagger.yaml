  /api/v1/handoff/cart/session:
    delete:
      description: Hard-deletes the cart identified by the session token, cascading
        its items and its handoff session row. The session token dies with the row,
        so the X-Handoff-Session header the client cached stops resolving immediately
        — clients MUST drop it from their local store on a 204. Unlike /cart/cancel
        (which keeps the cart in a cancelled state), nothing is retained. A token
        that is unknown or already deleted is 404.
      parameters:
      - description: Session token
        in: header
        name: X-Handoff-Session
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Session deleted; discard the cached session header
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      summary: Delete the current handoff session
      tags:
      - handoff
