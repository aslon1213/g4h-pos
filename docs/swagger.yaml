        type: integer
      name:
        description: Product name
        type: string
      quantity_distribution:
        description: Stock levels by location
        items:
          $ref: '#/definitions/models.ProductDistribution'
        type: array
      rating:
        description: Average review rating (0..5), denormalized
        type: number
      review_count:
        description: Number of reviews, denormalized
        type: integer
      reviews:
        description: Recent reviews (product detail only)
        items:
          $ref: '#/definitions/models.Review'
        type: array
      sku:
        description: Stock Keeping Unit
        type: string
      updated_at:
        description: Last update timestamp
        type: string
    type: object
