        type: integer
      quantity:
        description: |-
          Fractional (product_stock.quantity is numeric(12,3)): weighted goods are
          stocked and sold by the kilogram, so a sale can decrement 1.5 of a unit.
        type: number
      unit:
        description: Unit of measurement (e.g. kg, pieces, etc)
        type: string
    type: object
  models.ProductPlace:
    properties:
      id:
        description: Unique identifier for the place
        type: string
      place_type:
        allOf:
        - $ref: '#/definitions/models.ProductPlaceType'
        description: Type of storage location
    type: object
  models.ProductPlaceType:
    enum:
    - branch
    - warehouse
    type: string
    x-enum-comments:
      ProductPlaceTypeBranch: Store branch location
      ProductPlaceTypeWarehouse: Central warehouse location
    x-enum-varnames:
    - ProductPlaceTypeBranch
    - ProductPlaceTypeWarehouse
  models.ProductProposal:
    properties:
      branch:
        type: string
      date:
        type: string
      fulfilled:
        type: boolean
      id:
        type: string
      image_file:
        type: string
      name:
        type: string
    type: object
  models.RegisterInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  models.RequestHandoffResponse:
    properties:
      cart:
        $ref: '#/definitions/models.SaleCart'
      code:
        type: string
      expires_at:
        type: string
      qr_ref:
        type: string
    type: object
  models.Review:
    properties:
      body:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      customer_name:
        type: string
      helpful_votes:
        type: integer
      id:
        type: string
      product_id:
        type: string
      rating:
        description: 1..5
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.SaleCart:
    properties:
      branch_id:
        type: string
      created_at:
        type: string
      finalized_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/models.SaleCartItem'
        type: array
      kind:
        $ref: '#/definitions/models.CartKind'
      sale_journal_id:
        type: string
      seller_id:
        description: 'POS: the staff user who opened the cart. Handoff: the seller
          who claimed it.'
        type: string
      session:
        allOf:
        - $ref: '#/definitions/models.HandoffSession'
        description: Session is the handoff satellite, attached only for Kind == CartKindHandoff.
      state:
        $ref: '#/definitions/models.CartState'
      subtotal:
        type: integer
      updated_at:
        type: string
    type: object
  models.SaleCartItem:
    properties:
      id:
        type: string
      line_total:
        type: integer
      name:
        type: string
      product_id:
        type: string
      quantity:
        type: number
      sku:
        type: string
      unit_price:
        type: integer
      uom:
        type: string
    type: object
  models.SalesSession:
    properties:
      branch_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      product_items:
        additionalProperties:
          $ref: '#/definitions/models.SalesSessionItem'
        description: product which are going to be sold
        type: object
    type: object
  models.SalesSessionItem:
    properties:
      price:
        type: integer
      quantity:
        type: integer
    type: object
  models.StartHandoffSessionInput:
    properties:
      branch_id:
        type: string
    type: object
  models.StartHandoffSessionResponse:
    properties:
      cart:
        $ref: '#/definitions/models.SaleCart'
      session_token:
        type: string
    type: object
  models.StoreCustomer:
    properties:
      addresses:
        items:
          $ref: '#/definitions/models.Address'
        type: array
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  models.Supplier:
    properties:
      address:
        type: string
      branch:
        description: holds a branch id (FK)
        type: string
      created_at:
        type: string
      email:
        type: string
      financial_data:
        $ref: '#/definitions/models.FinancialData'
      id:
        type: string
      inn:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  models.SupplierBase:
    properties:
      address:
        type: string
      branch:
        description: holds a branch id (FK)
        type: string
      email:
        type: string
      inn:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
    type: object
  models.TokenPairResponse:
    properties:
      access_token:
        type: string
      data:
        description: = AccessToken; backward-compat alias for older clients
        type: string
      expires_at:
        description: access token expiry
        type: string
      refresh_expires_at:
        description: refresh token expiry
        type: string
      refresh_token:
        type: string
      token_type:
        description: '"Bearer"'
        type: string
    type: object
  models.TokenResponse:
    properties:
      aud:
        type: string
      data:
        type: string
      exp:
        type: string
      iat:
        type: string
      jti:
        type: string
      nbf:
        type: string
      sub:
        type: string
    type: object
  models.Transaction:
    properties:
      amount:
        type: integer
      bnpl_id:
        type: string
      branch_id:
        type: string
      cart_id:
        description: |-
          CartID is the type-specific reference for initiator_type='sale': the
          sale_carts row whose items produced this transaction. It is NULL for a
          keyed/manual sale (an amount typed straight into a journal or the sales
          endpoint), which has no items to point at — so a null cart on a sale is
          expected, not a broken link.
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      item_count:
        description: |-
          ItemCount is how many cart lines sit behind this transaction. It is NOT a
          column — the journals repository fills it in one batched query when it
          loads a journal's operations, so a staff list can show "12 items" without
          expanding every cart. Zero for any transaction with no cart.

          Clients decide whether a drill-in is available from CartID being non-null,
          not from this count (a cart could legitimately be empty).
        type: integer
      journal_id:
        description: |-
          Relational foreign keys (Postgres only; not persisted in Mongo). They
          replace journals.operations[], the embedded supplier transactions, and
          bnpl.transactions[].
        type: string
      payment_method:
        $ref: '#/definitions/models.PaymentMethod'
      supplier_id:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.InitiatorType'
        description: Type here is the initiator (sale/supplier/bnpl/...). Stored in
          `initiator_type`.
      updated_at:
        type: string
    type: object
  models.TransactionBase:
    properties:
      amount:
        type: integer
      description:
        type: string
      payment_method:
        $ref: '#/definitions/models.PaymentMethod'
      type:
        allOf:
        - $ref: '#/definitions/models.TransactionType'
        description: |-
          Type here is the credit/debit direction. In Mongo it collided on the bson
          key "type" with Transaction.Type (initiator) and was effectively dropped;
          in Postgres it has its own column `transaction_type`.
    type: object
  models.TransactionDetails:
    properties:
      bnpl:
        $ref: '#/definitions/models.BNPL'
      cart:
        $ref: '#/definitions/models.SaleCart'
      kind:
        $ref: '#/definitions/models.InitiatorType'
      supplier:
        $ref: '#/definitions/models.Supplier'
    type: object
  models.TransactionOutput:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Transaction'
        type: array
      error:
        items:
          $ref: '#/definitions/models.Error'
        type: array
    type: object
  models.TransactionOutputSingle:
    properties:
      data:
        $ref: '#/definitions/models.Transaction'
      error:
        items:
          $ref: '#/definitions/models.Error'
        type: array
    type: object
  models.TransactionType:
    enum:
    - credit
    - debit
    type: string
    x-enum-comments:
      TransactionTypeCredit: credit means - income - when money is gained or received
        into an account
      TransactionTypeDebit: debit means - outcome - when money is lost, spent, or
        withdrawn from an account
    x-enum-varnames:
    - TransactionTypeCredit
    - TransactionTypeDebit
  models.TransactionWithDetails:
    properties:
      amount:
        type: integer
      bnpl_id:
        type: string
      branch_id:
        type: string
      cart_id:
        description: |-
          CartID is the type-specific reference for initiator_type='sale': the
          sale_carts row whose items produced this transaction. It is NULL for a
          keyed/manual sale (an amount typed straight into a journal or the sales
          endpoint), which has no items to point at — so a null cart on a sale is
          expected, not a broken link.
        type: string
      created_at:
        type: string
      description:
        type: string
      details:
        $ref: '#/definitions/models.TransactionDetails'
      id:
        type: string
      item_count:
        description: |-
          ItemCount is how many cart lines sit behind this transaction. It is NOT a
          column — the journals repository fills it in one batched query when it
          loads a journal's operations, so a staff list can show "12 items" without
          expanding every cart. Zero for any transaction with no cart.

          Clients decide whether a drill-in is available from CartID being non-null,
          not from this count (a cart could legitimately be empty).
        type: integer
      journal_id:
        description: |-
          Relational foreign keys (Postgres only; not persisted in Mongo). They
          replace journals.operations[], the embedded supplier transactions, and
          bnpl.transactions[].
        type: string
      payment_method:
        $ref: '#/definitions/models.PaymentMethod'
      supplier_id:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.InitiatorType'
        description: Type here is the initiator (sale/supplier/bnpl/...). Stored in
          `initiator_type`.
      updated_at:
        type: string
    type: object
  models.UpdateProfileInput:
    properties:
      name:
        type: string
      phone:
        type: string
    type: object
  models.UpdateReviewInput:
    properties:
      body:
        type: string
      rating:
        type: integer
      title:
        type: string
    type: object
  models.UpdateSaleCartItemInput:
    properties:
      quantity:
        type: number
    type: object
  models.UserRegisterInput:
    properties:
      branch:
        type: string
      email:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/models.UserRole'
      username:
        type: string
    type: object
  models.UserRole:
    enum:
    - admin
    - staff
    - manager
    - user
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleStaff
    - UserRoleManager
    - UserRoleUser
  models.VoteReviewInput:
    properties:
      helpful:
        type: boolean
    type: object
  products.NewIncomeInput:
    properties:
      date:
        description: Date of the income
        type: string
      price:
        description: Price of the product that was uploaded
        type: integer
      quantity:
        description: 'Quantity of the product that was uploaded (fractional: numeric(12,3))'
        type: number
      selling_price:
        type: integer
      supplier_id:
        description: Supplier ID
        type: string
      uploaded_to:
        allOf:
        - $ref: '#/definitions/models.ProductPlace'
        description: Place where the product was uploaded to
    type: object
info:
  contact:
    email: hamidovaslon1@gmail.com
    name: G4H ERP/POS API
    url: https://github.com/aslon1213/g4h_pos_erp
  description: This is a ERP/POS API for G4H.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: G4H ERP/POS API
  version: "1.0"
paths:
  /api/sales/transactions/{branch_id}:
    post:
      consumes:
      - application/json
      description: Create a new sales transaction for a branch
      parameters:
      - description: Branch ID
        in: path
        name: branch_id
        required: true
        type: string
      - description: Transaction details
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/models.TransactionBase'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Output-models_Transaction'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Create a new sales transaction
      tags:
      - sales/transactions
  /api/sales/transactions/{transaction_id}:
    delete:
      consumes:
      - application/json
      description: Delete a sales transaction by ID
      parameters:
      - description: Transaction ID
        in: path
        name: transaction_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-models_Transaction'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Delete a sales transaction
      tags:
      - sales/transactions
  /api/v1/admin/activities/me:
    get:
      description: Get the 25 most recent activities for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-array_activities_repo_Activity'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Get activities of current user
      tags:
      - auth
  /api/v1/admin/activities/recent:
    get:
      description: Get the 25 most recent activities across all users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-array_activities_repo_Activity'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Get recent activities
      tags:
      - auth
  /api/v1/admin/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return an access + refresh token pair
      parameters:
      - description: User credentials
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: access + refresh tokens
          schema:
            $ref: '#/definitions/models.TokenPairResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      summary: Login a user
      tags:
      - auth
  /api/v1/admin/auth/me:
    get:
      description: Get user info
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Get user info
      tags:
      - auth
  /api/v1/admin/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a brand-new access + refresh
        token pair (the old refresh token is rotated out). This endpoint is NOT guarded
        by the access-token middleware — it authenticates via the refresh token in
        the body. Once the refresh token itself expires the request is rejected with
        401 and the user must log in again.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: new access + refresh tokens
          schema:
            $ref: '#/definitions/models.TokenPairResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      summary: Refresh the token pair
      tags:
      - auth
  /api/v1/admin/bnpl:
    post:
      consumes:
      - application/json
      description: Create a new Buy Now Pay Later transaction
      parameters:
      - description: BNPL input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.NewBNPLInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-array_models_BNPL'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Create new BNPL
      tags:
      - BNPL
  /api/v1/admin/bnpl/{id}:
    delete:
      description: Delete an existing BNPL transaction
      parameters:
      - description: BNPL ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Delete BNPL
      tags:
      - BNPL
    get:
      description: Get details of a specific BNPL transaction
      parameters:
      - description: BNPL ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-models_BNPL'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Get BNPL details
      tags:
      - BNPL
  /api/v1/admin/bnpl/{id}/credit:
    post:
      consumes:
      - application/json
      description: Add a credit payment to an existing BNPL
      parameters:
      - description: BNPL ID
        in: path
        name: id
        required: true
        type: string
      - description: Payment amount
        in: query
        name: amount
        required: true
        type: integer
      - default: cash
        description: Payment method
        in: query
        name: payment_method
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-array_models_BNPL'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Credit BNPL payment
      tags:
      - BNPL
  /api/v1/admin/branches/{branch_id}/bnpls:
    get:
      description: Get all BNPL transactions for a specific branch
      parameters:
      - description: Branch ID
        in: path
        name: branch_id
        required: true
        type: string
      - description: Customer name
        in: query
        name: customer_name
        type: string
      - description: Customer phone
        in: query
        name: customer_phone
        type: string
      - description: Customer address
        in: query
        name: customer_address
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-array_models_Customer'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Get BNPLs of branch
      tags:
      - BNPL
  /api/v1/admin/catalog/brands:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-array_models_Brand'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: List all catalog brands
      tags:
      - catalog
    post:
      consumes:
      - application/json
      parameters:
      - description: Brand details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.BrandInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Output-models_Brand'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Create a catalog brand
      tags:
      - catalog
  /api/v1/admin/catalog/brands/{id}:
    delete:
      parameters:
      - description: Brand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-models_MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Delete a catalog brand
      tags:
      - catalog
    get:
      parameters:
      - description: Brand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-models_Brand'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Get a catalog brand by id
      tags:
      - catalog
    put:
      consumes:
      - application/json
      parameters:
      - description: Brand ID
        in: path
        name: id
        required: true
        type: string
      - description: Brand fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.BrandInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-models_Brand'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Update a catalog brand
      tags:
      - catalog
  /api/v1/admin/catalog/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-array_models_Category'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: List all catalog categories (including inactive)
      tags:
      - catalog
    post:
      consumes:
      - application/json
      parameters:
      - description: Category details
        in: body
        name: body
        required: true
