  models.JournalOperationInput:
    properties:
      amount:
        type: integer
      cart_id:
        description: |-
          CartID links a sale operation back to the sale_carts row that produced it,
          so staff can open the operation and see the items. Set by the cart checkout
          flow only: a keyed/manual sale has no cart and leaves this empty.
        type: string
      description:
        type: string
      payment_method:
        $ref: '#/definitions/models.PaymentMethod'
      supplier_id:
        type: string
      supplier_transaction:
        type: boolean
      type:
        allOf:
        - $ref: '#/definitions/models.TransactionType'
        description: |-
          Type here is the credit/debit direction. In Mongo it collided on the bson
          key "type" with Transaction.Type (initiator) and was effectively dropped;
          in Postgres it has its own column `transaction_type`.
    type: object
