  /api/v1/admin/handoff/carts/{id}/checkout:
    post:
      consumes:
      - application/json
      description: Requires the handoff.checkout capability and an Idempotency-Key
        header. Records the sale on the seller's OPEN shift journal at the cart's
        branch, then decrements branch stock by each line's quantity. A handoff cart
        must be claimed by the caller; a POS cart must be theirs and still active.
        Replaying the same idempotency key returns the completed cart without charging
        or decrementing again.
      parameters:
      - description: Cart ID
        in: path
        name: id
        required: true
        type: string
      - description: Idempotency key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Open journal + payment method
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CheckoutCartInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Output-models_SaleCart'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorOutput'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorOutput'
      security:
      - BearerAuth: []
      summary: Charge a cart (delegates to the sale flow and decrements stock)
      tags:
      - handoff
