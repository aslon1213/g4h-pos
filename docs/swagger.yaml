  models.Product:
    properties:
      brand:
        allOf:
        - $ref: '#/definitions/models.Brand'
        description: Resolved catalog info for BrandID
      brand_id:
        description: Brand id (referencing the `brands` catalog collection)
        type: string
      categories:
        description: Attached on read for the storefront (never persisted on the product
          doc).
        items:
          $ref: '#/definitions/models.Category'
        type: array
      category:
        description: Product category ids (referencing the `categories` catalog collection)
        items:
          type: string
        type: array
      created_at:
        description: Creation timestamp
        type: string
      description:
        description: Product description
        type: string
      general_income_price:
        description: General income price of the product --- the price generally this
          item is bought from supplier
        type: number
      id:
        description: Unique product identifier
        type: string
      images:
        description: Product images (lins) saved to some S3
        items:
          type: string
        type: array
      income_history:
        description: Income history
        items:
          $ref: '#/definitions/models.IncomeHistory'
        type: array
      manufacturer:
        allOf:
